<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="description" content="Доктор Мона Абдуллаева — эстетическая стоматология и ортодонтия в Москве. Бесплатная диагностика и снимок на первом приёме." />
    <script>
      (() => {
        const supported = ['ru', 'tg', 'kg', 'uz', 'kz'];
        const pathLocale = location.pathname.split('/').filter(Boolean)[0];
        let locale = supported.includes(pathLocale) ? pathLocale : null;
        try {
          if (!locale) {
            const savedLocale = localStorage.getItem('dr-mona-locale');
            if (supported.includes(savedLocale)) locale = savedLocale;
          }
        } catch {}
        if (!locale) {
          const browserLanguage = (navigator.languages && navigator.languages[0] || navigator.language || 'ru').toLowerCase();
          locale = browserLanguage.startsWith('tg') || browserLanguage.startsWith('tj') ? 'tg'
            : browserLanguage.startsWith('ky') || browserLanguage.startsWith('kg') ? 'kg'
            : browserLanguage.startsWith('uz') ? 'uz'
            : browserLanguage.startsWith('kk') || browserLanguage.startsWith('kz') ? 'kz' : 'ru';
        }
        const htmlLang = ({ ru: 'ru', tg: 'tg', kg: 'ky', uz: 'uz', kz: 'kk' })[locale] || 'ru';
        document.documentElement.lang = htmlLang;
        if (!pathLocale && locale !== 'ru') history.replaceState(null, '', '/' + locale + location.search + location.hash);
        let theme = 'light';
        try {
          const savedTheme = localStorage.getItem('dr-mona-theme');
          theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Dr. Mona Abdullaeva — Эстетическая стоматология</title>
  </head>
  <body>
    <div id="app-preloader" role="status" aria-label="Загрузка сайта">
      <div class="preloader-mark"><span></span><span></span><span></span></div>
      <div class="preloader-brand">DR. MONA</div>
      <div class="preloader-caption">ABDULLAEVA</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
